[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitsin"
version = "0.1.1"
description = "GitSin Auditor - Deterministic Security Scanning"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
gitsin = "gitsin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gitsin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
